<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Iniciar sessão</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div style="position: absolute; inset: 0; padding: 70px 24px 34px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <dc-import name="Guru" pose="ola" size="{{ 150 }}" hint-size="150px,180px"></dc-import>
      <div style="display: flex; align-items: center; gap: 10px">
      <svg width="40" height="40" viewBox="0 0 100 100" role="img" aria-label="Ícone KangarooSplit" style="border-radius: 10px">
        <rect width="100" height="100" rx="22" fill="#6847F0"></rect>
        <circle cx="50" cy="36" r="15" fill="#FFC94A"></circle>
        <circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle>
        <path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path>
        <path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path>
      </svg>
      <span style="font-size: 28px; font-weight: 700; letter-spacing: -0.2px">KangarooSplit</span>
      </div>
    </div>

    <form style="display: flex; flex-direction: column; gap: 14px" aria-labelledby="login-title">
      <h1 id="login-title" style="margin: 0 0 2px; font-size: 22px; font-weight: 700">Iniciar sessão</h1>
      <div style="border-radius: 16px; background: #FFFFFF; overflow: hidden; box-shadow: {{fieldRing}}">
        <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px">
          <span style="font-size: 13px; color: #6B6B76">Email</span>
          <input type="email" autocomplete="username" value="miguel@exemplo.pt" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: #111114; padding: 0">
        </label>
        <label style="display: flex; flex-direction: column; gap: 2px; padding: 10px 16px; border-top: 0.5px solid #E6E6EC">
          <span style="font-size: 13px; color: #6B6B76">Palavra-passe</span>
          <input type="password" autocomplete="current-password" value="segredo123" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: #111114; padding: 0">
        </label>
      </div>
      <sc-if value="{{error}}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: #FDECEA; color: #A3220F; font-size: 15px">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg>
          Email ou palavra-passe incorretos.
        </div>
      </sc-if>
      <button type="submit" style="height: 52px; border: 0; border-radius: 16px; background: #6847F0; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Entrar</button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const error = !!this.props.error;
    return { error, fieldRing: error ? '0 0 0 1.5px #C42B1C' : 'none' };
  }
}
</script>
</body>
</html>
