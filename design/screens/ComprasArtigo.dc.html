<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Compras — editar artigo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #111114">
  <dc-import name="Compras" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.38)"></div>

  <div role="dialog" aria-label="Editar artigo" style="position: absolute; left: 0; right: 0; top: 268px; bottom: 0; border-radius: 14px 14px 0 0; background: #F2F2F7; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 6px auto 0"></div>
    <div style="height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px">
      <button type="button" style="justify-self: start; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; cursor: pointer">Cancelar</button>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">Artigo</h1>
      <button type="button" style="justify-self: end; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Guardar</button>
    </div>

    <div style="padding: 4px 16px 34px; display: flex; flex-direction: column; gap: 12px">
      <div style="border-radius: 18px; background: #FFFFFF; overflow: hidden">
        <div style="height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 10px">
          <button type="button" aria-label="Mudar emoji" style="width: 44px; height: 44px; border: 0; border-radius: 12px; background: #F2F2F7; font-size: 24px; cursor: pointer; padding: 0">🧀</button>
          <input type="text" aria-label="Nome do artigo" value="Queijo da Serra" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; font-weight: 600; color: #111114">
        </div>
        <div style="border-top: 0.5px solid #E6E6EC; height: 52px; display: flex; align-items: center; padding: 0 8px 0 16px">
          <span style="flex: 1; font-size: 17px">Quantidade</span>
          <div style="display: flex; align-items: center; border-radius: 10px; background: #EEEEF3; height: 40px">
            <button type="button" aria-label="Menos um" style="width: 44px; height: 40px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 22px; cursor: pointer">−</button>
            <span style="min-width: 24px; text-align: center; font-size: 17px; font-weight: 600">1</span>
            <button type="button" aria-label="Mais um" style="width: 44px; height: 40px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
        <label style="border-top: 0.5px solid #E6E6EC; height: 52px; display: flex; align-items: center; padding: 0 16px">
          <input type="text" aria-label="Nota (opcional)" placeholder="Nota (opcional)" value="Para o jantar de sábado" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px; color: #111114">
        </label>
      </div>

      <div style="border-radius: 18px; background: #FFFFFF; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 13px; color: #6B6B76; padding: 0 4px">Secção</span>
        <div role="radiogroup" aria-label="Secção" style="display: flex; flex-wrap: wrap; gap: 6px">
          <sc-for list="{{aisles}}" as="a" hint-placeholder-count="10">
            <button type="button" role="radio" aria-checked="{{a.on}}" style="height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: {{a.bg}}; color: {{a.fg}}; font: inherit; font-size: 14px; font-weight: {{a.fw}}; cursor: pointer">{{a.label}}</button>
          </sc-for>
        </div>
      </div>

      <span style="font-size: 13px; color: #6B6B76; padding: 0 4px">Adicionado pela Mara · ontem, 19:02</span>
      <button type="button" style="height: 50px; border: 0; border-radius: 16px; background: #FFFFFF; color: #C42B1C; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Apagar artigo</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = ['Frutas e legumes', 'Padaria', 'Laticínios e ovos', 'Talho e peixe', 'Mercearia', 'Congelados', 'Bebidas', 'Limpeza', 'Higiene', 'Outros'];
    const aisles = list.map((label) => {
      const on = label === 'Laticínios e ovos';
      return { label, on: on ? 'true' : 'false', bg: on ? '#6847F0' : '#F2F2F7', fg: on ? '#FFFFFF' : '#111114', fw: on ? 600 : 400 };
    });
    return { aisles };
  }
}
</script>
</body>
</html>
