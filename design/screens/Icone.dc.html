<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Ícone da app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; box-sizing: border-box; padding: 56px; background: #F7F7FA; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 40px">
  <div style="display: flex; gap: 48px; align-items: center">
    <svg width="320" height="320" viewBox="0 0 100 100" role="img" aria-label="Ícone KangarooSplit: bolsa de canguru com uma moeda" style="border-radius: 70px; box-shadow: 0 24px 60px rgba(104,71,240,0.30); flex: none">
      <rect width="100" height="100" rx="22" fill="{{bg}}"></rect>
      <circle cx="50" cy="36" r="15" fill="#FFC94A"></circle>
      <circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle>
      <path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path>
      <path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path>
    </svg>
    <div style="display: flex; flex-direction: column; gap: 18px">
      <span style="font-size: 30px; font-weight: 700">KangarooSplit</span>
      <span style="font-size: 17px; line-height: 24px; color: #4A4A55">A bolsa do canguru guarda o dinheiro dos dois.</span>
      <div style="display: flex; align-items: flex-end; gap: 18px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="60" height="60" viewBox="0 0 100 100" aria-hidden="true" style="border-radius: 14px"><rect width="100" height="100" rx="22" fill="{{bg}}"></rect><circle cx="50" cy="36" r="15" fill="#FFC94A"></circle><circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle><path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path><path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path></svg>
          <span style="font-size: 11px; color: #6B6B76">60 pt</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="40" height="40" viewBox="0 0 100 100" aria-hidden="true" style="border-radius: 9px"><rect width="100" height="100" rx="22" fill="{{bg}}"></rect><circle cx="50" cy="36" r="15" fill="#FFC94A"></circle><circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle><path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path><path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path></svg>
          <span style="font-size: 11px; color: #6B6B76">40 pt</span>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
          <svg width="29" height="29" viewBox="0 0 100 100" aria-hidden="true" style="border-radius: 7px"><rect width="100" height="100" rx="22" fill="{{bg}}"></rect><circle cx="50" cy="36" r="15" fill="#FFC94A"></circle><circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle><path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path><path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path></svg>
          <span style="font-size: 11px; color: #6B6B76">29 pt</span>
        </div>
      </div>
    </div>
  </div>

  <div style="flex: 1; border-radius: 28px; background: #1B1530; padding: 28px 32px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; align-content: center">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px">
        <sc-if value="{{a.ours}}" hint-placeholder-val="{{ false }}">
          <svg width="64" height="64" viewBox="0 0 100 100" aria-hidden="true" style="border-radius: 15px"><rect width="100" height="100" rx="22" fill="{{bg}}"></rect><circle cx="50" cy="36" r="15" fill="#FFC94A"></circle><circle cx="50" cy="36" r="10.5" fill="none" stroke="#E0A21A" stroke-width="2"></circle><path d="M21 46h58v8c0 17-13 29-29 29S21 71 21 54z" fill="#FFFFFF"></path><path d="M28 54h44" stroke="#C9BCFB" stroke-width="2.4" stroke-dasharray="4 4" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{a.other}}" hint-placeholder-val="{{ true }}">
          <span style="width: 64px; height: 64px; border-radius: 15px; background: {{a.fill}}"></span>
        </sc-if>
        <span style="font-size: 12px; color: #F5F5F7">{{a.label}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bg":{"editor":"color","options":["#6847F0","#0B7A5C","#B85A12","#111114"],"default":"#6847F0"},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const bg = this.props.bg ?? '#6847F0';
    const apps = [
      { label: 'Fotos', fill: '#3A3450' }, { label: 'KangarooSplit', ours: true }, { label: 'Mapas', fill: '#3A3450' }, { label: 'Notas', fill: '#3A3450' }
    ].map((a) => Object.assign({ ours: false }, a, { other: !a.ours }));
    return { bg, apps };
  }
}
</script>
</body>
</html>
