<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Nova lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 44px; height: 40px; border-radius: 12px; background: #8E8E93"></div>
  <div role="dialog" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; border-radius: 14px 14px 0 0; background: #F2F2F7; overflow: hidden; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 6px auto 0"></div>
    <div style="height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px">
      <button type="button" style="justify-self: start; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; cursor: pointer">Cancelar</button>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">{{title}}</h1>
      <button type="button" style="justify-self: end; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Guardar</button>
    </div>

    <div style="flex: 1; padding: 6px 16px 34px; display: flex; flex-direction: column; gap: 12px">
      <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 14px">
        <span style="width: 60px; height: 60px; border-radius: 18px; background: #EFEAFE; display: flex; align-items: center; justify-content: center; font-size: 32px; flex: none">{{icon}}</span>
        <label style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 13px; color: #6B6B76">Nome</span>
          <input type="text" value="{{name}}" style="border: 0; outline: none; background: transparent; font: inherit; font-size: 20px; font-weight: 600; color: #111114; padding: 0">
        </label>
      </div>

      <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 10px 10px">
        <span style="display: block; padding: 0 6px 6px; font-size: 13px; color: #6B6B76">Ícone</span>
        <div role="radiogroup" aria-label="Ícone" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 0">
          <sc-for list="{{icons}}" as="i" hint-placeholder-count="16">
            <button type="button" role="radio" aria-checked="{{i.on}}" onClick="{{i.pick}}" style="height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer">
              <span style="width: 38px; height: 38px; border-radius: 12px; background: {{i.bg}}; box-shadow: {{i.ring}}; display: flex; align-items: center; justify-content: center; font-size: 22px">{{i.e}}</span>
            </button>
          </sc-for>
        </div>
      </div>

      <div style="border-radius: 20px; background: #FFFFFF; overflow: hidden">
        <button type="button" style="width: 100%; height: 48px; border: 0; background: transparent; color: #111114; font: inherit; display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer; text-align: left">
          <span style="flex: 1; font-size: 17px">Data de início (opcional)</span>
          <span style="font-size: 15px; padding: 5px 10px; border-radius: 999px; background: {{startBg}}; color: {{startColor}}">{{start}}</span>
        </button>
        <button type="button" style="width: 100%; height: 48px; border: 0; border-top: 0.5px solid #E6E6EC; background: transparent; color: #111114; font: inherit; display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer; text-align: left">
          <span style="flex: 1; font-size: 17px">Data de fim (opcional)</span>
          <span style="font-size: 15px; padding: 5px 10px; border-radius: 999px; background: {{startBg}}; color: {{startColor}}">{{end}}</span>
        </button>
      </div>

      <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-size: 17px">Divisão predefinida</span>
          <span style="font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{ratio}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-hidden="true">Mi</span>
          <input type="range" min="0" max="100" step="5" value="{{split}}" aria-label="Percentagem do Miguel" style="flex: 1; accent-color: #6847F0; height: 32px">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #C0367A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center" aria-hidden="true">Ma</span>
        </div>
        <div style="display: flex; gap: 8px">
          <sc-for list="{{presets}}" as="p" hint-placeholder-count="3">
            <button type="button" onClick="{{p.pick}}" style="flex: 1; height: 36px; border: 0; border-radius: 10px; background: {{p.bg}}; color: {{p.color}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{p.label}}</button>
          </sc-for>
        </div>
      </div>

      <sc-if value="{{edit}}" hint-placeholder-val="{{ false }}">
        <div style="border-radius: 20px; background: #FFFFFF; overflow: hidden">
          <button type="button" style="width: 100%; height: 50px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; cursor: pointer">Arquivar lista</button>
          <button type="button" style="width: 100%; height: 50px; border: 0; border-top: 0.5px solid #E6E6EC; background: transparent; color: #C42B1C; font: inherit; font-size: 17px; cursor: pointer">Apagar lista</button>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"edit":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    const edit = !!this.props.edit;
    const icon = this.state.icon ?? (edit ? '✈️' : '🎄');
    const split = this.state.split ?? (edit ? 50 : 50);
    const all = ['🏠', '✈️', '🎁', '🎄', '🏕️', '🚗', '🍽️', '🎉', '🐱', '🛒', '💡', '🏖️', '⛰️', '🎂', '📚', '🔨'];
    const icons = all.map((e) => ({ e, on: e === icon ? 'true' : 'false', bg: e === icon ? '#EFEAFE' : 'transparent',
      ring: e === icon ? 'inset 0 0 0 2px #6847F0' : 'none', pick: () => this.setState({ icon: e }) }));
    const presets = [50, 60, 70].map((v) => ({ label: v + ' / ' + (100 - v), bg: v === split ? '#6847F0' : '#EEEEF3', color: v === split ? '#FFFFFF' : '#111114', pick: () => this.setState({ split: v }) }));
    return {
      edit, icon, icons, presets, split,
      ratio: split + ' / ' + (100 - split),
      title: edit ? 'Editar lista' : 'Nova lista',
      name: edit ? 'Férias Açores' : 'Natal 2026',
      start: edit ? '02/08/2026' : '20/12/2026', end: edit ? '12/08/2026' : 'Sem data',
      startBg: '#EEEEF3', startColor: '#111114'
    };
  }
}
</script>
</body>
</html>
