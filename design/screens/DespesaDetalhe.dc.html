<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Detalhe da despesa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 44px; height: 40px; border-radius: 12px; background: {{c.ghost}}"></div>

  <div role="dialog" aria-label="Despesa: {{x.desc}}" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; border-radius: 14px 14px 0 0; background: {{c.bg}}; overflow: hidden; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: {{c.grabber}}; margin: 6px auto 0; flex: none"></div>
    <div style="height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; flex: none">
      <button type="button" style="justify-self: start; height: 44px; padding: 0 8px; border: 0; background: transparent; color: {{c.link}}; font: inherit; font-size: 17px; cursor: pointer">Fechar</button>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">Despesa</h1>
      <a href="DespesaEditar.dc.html" style="justify-self: end; height: 44px; padding: 0 8px; display: flex; align-items: center; color: {{c.link}}; font-size: 17px; font-weight: 600; text-decoration: none">Editar</a>
    </div>

    <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px; flex: none">
      <section aria-label="Resumo" style="border-radius: 20px; background: {{c.card}}; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; align-items: center; gap: 12px">
          <span style="width: 48px; height: 48px; border-radius: 14px; background: {{c.fill}}; display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none">{{x.icon}}</span>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 17px; font-weight: 600">{{x.desc}}</span>
            <span style="font-size: 13px; color: {{c.text2}}">{{x.meta}}</span>
          </div>
          <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums">{{x.amount}}</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; border-top: 0.5px solid {{c.sep}}; padding-top: 10px">
          <span style="display: flex; align-items: center; gap: 4px; flex: 1; font-size: 15px; font-weight: 600; color: {{x.posColor}}; font-variant-numeric: tabular-nums">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.arrow}}"></path></svg>
            {{x.position}}
          </span>
          <sc-if value="{{x.receipt}}" hint-placeholder-val="{{ false }}">
            <button type="button" style="height: 32px; padding: 0 10px; border: 0; border-radius: 999px; background: {{c.fill}}; color: {{c.text}}; font: inherit; font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 5px; cursor: pointer">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.3 3.3 0 0 1 4.7 4.7l-8.5 8.5a1.7 1.7 0 0 1-2.4-2.4L15.5 7"></path></svg>
              Recibo
            </button>
          </sc-if>
        </div>
        <sc-if value="{{x.hasNote}}" hint-placeholder-val="{{ false }}">
          <p style="margin: 0; font-size: 15px; line-height: 20px; color: {{c.text2}}">Nota: {{x.note}}</p>
        </sc-if>
      </section>

      <div role="group" aria-label="Reações" style="border-radius: 18px; background: {{c.card}}; padding: 6px; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 2px">
        <sc-for list="{{reactions}}" as="r" hint-placeholder-count="6">
          <button type="button" aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" onClick="{{r.pick}}" style="height: 48px; border: 0; border-radius: 13px; background: {{r.bg}}; box-shadow: {{r.ring}}; font-size: 24px; position: relative; cursor: pointer; padding: 0">
            {{r.e}}
            <sc-if value="{{r.mara}}" hint-placeholder-val="{{ false }}">
              <span aria-hidden="true" style="position: absolute; right: 2px; bottom: 2px; width: 18px; height: 18px; border-radius: 9px; background: #C0367A; border: 2px solid {{c.card}}; color: #FFFFFF; font-size: 7.5px; font-weight: 700; display: flex; align-items: center; justify-content: center; box-sizing: content-box">Ma</span>
            </sc-if>
          </button>
        </sc-for>
      </div>
      <p aria-live="polite" style="margin: -4px 4px 0; font-size: 13px; color: {{c.text2}}; min-height: 18px">{{reactionSummary}}</p>

      <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: {{c.text2}}; text-transform: uppercase; letter-spacing: 0.4px">{{commentsTitle}}</h2>
    </div>

    <div role="log" aria-label="Comentários" style="flex: 1; min-height: 0; overflow: hidden; padding: 8px 16px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px">
      <sc-if value="{{noMessages}}" hint-placeholder-val="{{ false }}">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; color: {{c.text2}}">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"></path></svg>
          <span style="font-size: 15px; font-weight: 600; color: {{c.text}}">Ainda não há comentários.</span>
          <span style="font-size: 13px">Escreve à Mara sobre esta despesa.</span>
        </div>
      </sc-if>
      <sc-for list="{{messages}}" as="m" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <sc-if value="{{m.day}}" hint-placeholder-val="{{ false }}">
            <span style="align-self: center; font-size: 12px; font-weight: 500; color: {{c.text2}}; padding: 4px 0">{{m.dayLabel}}</span>
          </sc-if>
          <div style="display: flex; align-items: flex-end; gap: 8px; justify-content: {{m.justify}}">
            <sc-if value="{{m.theirs}}" hint-placeholder-val="{{ true }}">
              <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 14px; background: #C0367A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; visibility: {{m.avatarVis}}">Ma</span>
            </sc-if>
            <div style="max-width: 260px; display: flex; flex-direction: column; align-items: {{m.align}}; gap: 2px">
              <span style="padding: 8px 12px; border-radius: {{m.radius}}; background: {{m.bg}}; color: {{m.fg}}; font-size: 16px; line-height: 21px">{{m.text}}</span>
              <span style="font-size: 11px; color: {{c.text2}}; padding: 0 6px">{{m.time}}</span>
            </div>
          </div>
        </div>
      </sc-for>
    </div>

    <form onSubmit="{{send}}" style="flex: none; border-top: 0.5px solid {{c.sep}}; background: {{c.bar}}; padding: 8px 12px 34px; display: flex; align-items: flex-end; gap: 8px">
      <label style="flex: 1; min-height: 40px; border-radius: 20px; background: {{c.inputBg}}; box-shadow: inset 0 0 0 1px {{c.sep}}; display: flex; align-items: center; padding: 0 14px">
        <input type="text" aria-label="Escreve um comentário" placeholder="Escreve um comentário…" value="{{draft}}" onChange="{{onDraft}}" disabled="{{offline}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 16px; color: {{c.text}}">
      </label>
      <button type="submit" aria-label="Enviar comentário" disabled="{{cannotSend}}" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: {{sendBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </form>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"variant":{"editor":"enum","options":["conversa","vazia"],"default":"conversa"},"offline":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = {}; }
  renderVals() {
    const dark = !!this.props.dark;
    const variant = this.props.variant ?? 'conversa';
    const offline = !!this.props.offline;
    const c = dark ? {
      bg: '#000000', card: '#1C1C1E', fill: '#2C2C2E', text: '#F5F5F7', text2: '#A1A1AA', sep: '#38383A',
      link: '#A893FF', accent: '#7B5CFA', accentSoft: '#2A2342', ghost: '#1C1C1E', grabber: '#545458',
      pos: '#3DD6A3', neg: '#FF9A5C', bar: 'rgba(22,22,24,0.94)', inputBg: '#1C1C1E', theirBubble: '#2C2C2E', disabled: '#3A3A3D'
    } : {
      bg: '#F2F2F7', card: '#FFFFFF', fill: '#F2F2F7', text: '#111114', text2: '#6B6B76', sep: '#E6E6EC',
      link: '#5B3FD9', accent: '#6847F0', accentSoft: '#EFEAFE', ghost: '#8E8E93', grabber: '#C7C7CC',
      pos: '#0B7A5C', neg: '#B93D0B', bar: 'rgba(249,249,251,0.96)', inputBg: '#FFFFFF', theirBubble: '#FFFFFF', disabled: '#C7C7CE'
    };
    const up = 'M7 17 17 7M8 7h9v9';
    const down = 'M17 7 7 17M7 8v9h9';
    const conversa = variant === 'conversa';
    const x = conversa ? {
      icon: '🍽️', desc: 'Jantar no Ramiro', amount: '74,00 €', meta: '08/10/2026 · 🏠 Casa · Pago pela Mara',
      position: 'Deves 44,40 € · 60 / 40', posColor: c.neg, arrow: up, receipt: true,
      hasNote: true, note: 'Jantar de aniversário 🎂'
    } : {
      icon: '🛒', desc: 'Continente', amount: '86,35 €', meta: '10/10/2026 · 🏠 Casa · Pago por ti',
      position: 'Emprestaste 34,54 € · 60 / 40', posColor: c.pos, arrow: down, receipt: false, hasNote: false, note: ''
    };
    const maraR = conversa ? '❤️' : null;
    const myR = this.state.myR !== undefined ? this.state.myR : (conversa ? '😂' : null);
    const emojis = ['❤️', '👍', '😂', '😮', '😬', '🙏'];
    const names = { '❤️': 'coração', '👍': 'polegar para cima', '😂': 'a rir', '😮': 'surpresa', '😬': 'ai', '🙏': 'obrigado' };
    const reactions = emojis.map((e) => {
      const mine = e === myR;
      return {
        e, mine, mara: e === maraR, pressed: mine ? 'true' : 'false',
        aria: 'Reagir com ' + names[e] + (mine ? ' (a tua reação)' : '') + (e === maraR ? ' (reação da Mara)' : ''),
        bg: mine ? c.accentSoft : 'transparent',
        ring: mine ? 'inset 0 0 0 2px ' + c.accent : 'none',
        pick: () => { if (!offline) this.setState({ myR: mine ? null : e }); }
      };
    });
    const parts = [];
    if (maraR) parts.push('A Mara reagiu com ' + maraR);
    if (myR) parts.push('reagiste com ' + myR);
    let reactionSummary = parts.join(' · ');
    if (reactionSummary) reactionSummary = reactionSummary.charAt(0).toUpperCase() + reactionSummary.slice(1);
    else reactionSummary = 'Toca num emoji para reagir.';

    const base = conversa ? [
      { mine: false, text: 'O melhor polvo do ano 🐙', time: 'A Mara · 21:14', day: 'Hoje' },
      { mine: true, text: 'Para a próxima pago eu!', time: '21:20 · editado' },
      { mine: false, text: 'Combinado 😄', time: 'A Mara · 21:22' }
    ] : [];
    const extra = this.state.extra || [];
    const all = base.concat(extra);
    const messages = all.map((m, i) => {
      const next = all[i + 1];
      const lastOfRun = !next || next.mine !== m.mine;
      return Object.assign({}, m, {
        theirs: !m.mine, day: !!m.day, dayLabel: m.day || '',
        justify: m.mine ? 'flex-end' : 'flex-start', align: m.mine ? 'flex-end' : 'flex-start',
        bg: m.mine ? c.accent : c.theirBubble, fg: m.mine ? '#FFFFFF' : c.text,
        radius: m.mine ? (lastOfRun ? '18px 18px 6px 18px' : '18px') : (lastOfRun ? '18px 18px 18px 6px' : '18px'),
        avatarVis: lastOfRun ? 'visible' : 'hidden'
      });
    });
    const draft = this.state.draft || '';
    const cannotSend = offline || draft.trim() === '';
    return {
      c, x, reactions, reactionSummary, messages, noMessages: messages.length === 0, offline,
      commentsTitle: messages.length ? 'Comentários · ' + messages.length : 'Comentários',
      draft, cannotSend, sendBg: cannotSend ? c.disabled : c.accent,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      send: (e) => {
        if (e && e.preventDefault) e.preventDefault();
        if (cannotSend) return;
        this.setState({ extra: extra.concat([{ mine: true, text: draft.trim(), time: 'agora' }]), draft: '' });
      }
    };
  }
}
</script>
</body>
</html>
