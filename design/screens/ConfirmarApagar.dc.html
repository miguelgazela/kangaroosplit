<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Confirmar apagar lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #111114">
  <dc-import name="NovaLista" edit="{{ true }}" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0,0,0,0.38)"></div>
  <div role="alertdialog" aria-labelledby="del-msg" style="position: absolute; left: 8px; right: 8px; bottom: 34px; display: flex; flex-direction: column; gap: 8px">
    <div style="border-radius: 14px; background: rgba(249,249,251,0.96); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); overflow: hidden">
      <p id="del-msg" style="margin: 0; padding: 14px 20px; font-size: 13px; line-height: 18px; color: #6B6B76; text-align: center">Apagar esta lista e todas as suas despesas? Esta ação não pode ser anulada.</p>
      <button type="button" style="width: 100%; height: 57px; border: 0; border-top: 0.5px solid #D8D8DE; background: transparent; color: #C42B1C; font: inherit; font-size: 20px; cursor: pointer">Apagar lista</button>
    </div>
    <button type="button" style="height: 57px; border: 0; border-radius: 14px; background: #FFFFFF; color: #5B3FD9; font: inherit; font-size: 20px; font-weight: 600; cursor: pointer">Cancelar</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
