<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Barra de separadores</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 100px; position: relative; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: {{c.text}}">
  <nav aria-label="Navegação principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; background: {{c.bar}}; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 0.5px solid {{c.sep}}; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 6px; box-sizing: border-box">
    <sc-for list="{{left}}" as="t" hint-placeholder-count="2">
      <a href="#" style="height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.color}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span style="font-size: 10px; font-weight: {{t.fw}}; letter-spacing: 0.1px">{{t.label}}</span>
      </a>
    </sc-for>
    <div style="height: 49px"></div>
    <sc-for list="{{right}}" as="t" hint-placeholder-count="2">
      <a href="#" style="height: 49px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{t.color}}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{t.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span style="font-size: 10px; font-weight: {{t.fw}}; letter-spacing: 0.1px">{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
  <button type="button" aria-label="Nova despesa" style="position: absolute; left: 165px; top: 0px; width: 60px; height: 60px; border-radius: 30px; border: 4px solid {{c.ring}}; background: {{c.fab}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: {{c.fabShadow}}; cursor: pointer; padding: 0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["inicio","atividade","estatisticas","definicoes"],"default":"inicio"},"dark":{"editor":"boolean","default":false},"disabled":{"editor":"boolean","default":false},"$preview":{"width":390,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const active = this.props.active ?? 'inicio';
    const disabled = !!this.props.disabled;
    const c = dark ? {
      text: '#F5F5F7', bar: 'rgba(22,22,24,0.86)', sep: '#38383A', on: '#A893FF', off: '#9A9AA3',
      fab: disabled ? '#3A3A3D' : '#7B5CFA', ring: '#000000', fabShadow: disabled ? 'none' : '0 6px 18px rgba(123,92,250,0.45)'
    } : {
      text: '#111114', bar: 'rgba(255,255,255,0.88)', sep: '#E3E3E8', on: '#5B3FD9', off: '#6B6B76',
      fab: disabled ? '#C7C7CE' : '#6847F0', ring: '#F2F2F7', fabShadow: disabled ? 'none' : '0 6px 18px rgba(104,71,240,0.35)'
    };
    const icons = {
      inicio: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      atividade: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M12 7v5l3 2',
      estatisticas: 'M5 20V12M12 20V5M19 20v-9M3 20h18',
      definicoes: 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'
    };
    const mk = (id, label) => ({
      label, d: icons[id],
      color: id === active ? c.on : c.off,
      fw: id === active ? 600 : 500,
      sw: id === active ? 2.2 : 1.8
    });
    return {
      c,
      left: [mk('inicio', 'Início'), mk('atividade', 'Atividade')],
      right: [mk('estatisticas', 'Estatísticas'), mk('definicoes', 'Definições')]
    };
  }
}
</script>
</body>
</html>
