<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Atividade</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div style="position: absolute; inset: 0; padding: 54px 16px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="height: 44px; display: flex; align-items: center; margin: 0 -8px">
      <a href="Main.dc.html" style="height: 44px; display: flex; align-items: center; gap: 2px; padding-right: 8px; color: #5B3FD9; text-decoration: none; font-size: 17px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
        Início
      </a>
    </div>
    <h1 style="margin: -6px 0 0; height: 44px; display: flex; align-items: center; font-size: 34px; font-weight: 700; letter-spacing: 0.4px">Atividade</h1>

    <sc-for list="{{days}}" as="d" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 600; color: #6B6B76; text-transform: uppercase; letter-spacing: 0.4px">{{d.label}}</h2>
        <div style="border-radius: 20px; background: #FFFFFF; overflow: hidden">
          <sc-for list="{{d.items}}" as="e" hint-placeholder-count="2">
            <div style="padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; border-top: {{e.border}}; background: {{e.bg}}">
              <span style="position: relative; flex: none">
                <span style="width: 36px; height: 36px; border-radius: 18px; background: {{e.color}}; color: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{e.ini}}</span>
                <span style="position: absolute; right: -4px; bottom: -4px; width: 20px; height: 20px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
                  <span style="width: 16px; height: 16px; border-radius: 8px; background: {{e.badgeBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                    <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{e.badge}}"></path></svg>
                  </span>
                </span>
              </span>
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 15px; line-height: 20px">{{e.text}}</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #6B6B76">
                  <span style="padding: 1px 8px; border-radius: 999px; background: #F2F2F7">{{e.list}}</span>
                  <span>{{e.time}}</span>
                </span>
              </span>
              <sc-if value="{{e.restorable}}" hint-placeholder-val="{{ false }}">
                <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: 999px; background: #EFEAFE; color: #4B2FD0; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; align-self: center; position: relative">
                  <span aria-hidden="true" style="position: absolute; inset: -5px 0"></span>Restaurar
                </button>
              </sc-if>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 100px">
    <dc-import name="TabBar" active="inicio" badge="6" hint-size="390px,100px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const MI = { ini: 'Mi', color: '#2563EB' };
    const MA = { ini: 'Ma', color: '#C0367A' };
    const B = {
      add: ['M12 6v12M6 12h12', '#0B7A5C'],
      edit: ['M4 20h4L19 9l-4-4L4 16z', '#5B3FD9'],
      del: ['M6 6l12 12M18 6 6 18', '#C42B1C'],
      restore: ['M4 12a8 8 0 1 0 2.5-5.8M4 4v4h4', '#0B7A5C'],
      settle: ['M7 7h12l-4-4M17 17H5l4 4', '#5B3FD9'],
      list: ['M5 6h14M5 12h14M5 18h9', '#6B6B76'],
      archive: ['M4 5h16v4H4zM6 9v10h12V9', '#6B6B76'],
      comment: ['M20 12a7 7 0 0 1-10.2 6.2L5 19l1-4A7 7 0 1 1 20 12z', '#5B3FD9'],
      react: ['M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z', '#C0367A']
    };
    const e = (who, type, text, list, time, extra) => Object.assign({}, who, {
      text, list, time, badge: B[type][0], badgeBg: B[type][1], restorable: false, bg: '#FFFFFF'
    }, extra || {});
    const days = [
      { label: 'Hoje', items: [
        e(MA, 'comment', 'A Mara comentou “Jantar no Ramiro”: “Combinado 😄”', '🏠 Casa', '21:22', { open: true }),
        e(MA, 'react', 'A Mara reagiu com ❤️ a “Jantar no Ramiro”', '🏠 Casa', '21:15'),
        e(MA, 'del', 'A Mara apagou “Táxi” · 12,50 €', '🏠 Casa', '09:15', { restorable: true }),
        e(MA, 'list', 'A Mara criou a lista “Natal 2026”', '🎄 Natal 2026', '08:40')
      ] },
      { label: 'Ontem', items: [
        e(MI, 'add', 'Adicionaste “Continente” · 86,35 €', '🏠 Casa', '19:20'),
        e(MA, 'edit', 'A Mara editou “Jantar no Ramiro”', '🏠 Casa', '13:05')
      ] },
      { label: 'Terça, 06 out', items: [
        e(MA, 'settle', 'A Mara pagou-te 354,65 €', '🏠 Casa', '21:10', { bg: '#F7F4FF' }),
        e(MI, 'archive', 'Arquivaste a lista “Gerês”', '🏕️ Gerês', '20:02'),
        e(MI, 'restore', 'Restauraste “Eletricidade”', '🏠 Casa', '19:55')
      ] }
    ].map((d) => Object.assign(d, { items: d.items.map((it, i) => Object.assign(it, { border: i === 0 ? 'none' : '0.5px solid #E6E6EC' })) }));
    return { days };
  }
}
</script>
</body>
</html>
