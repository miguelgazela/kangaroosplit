<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Acertar contas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 44px; height: 40px; border-radius: 12px; background: #8E8E93"></div>

  <div role="dialog" aria-label="{{title}}" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; border-radius: 14px 14px 0 0; background: #F2F2F7; overflow: hidden; display: flex; flex-direction: column">
    <div aria-hidden="true" style="width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC; margin: 6px auto 0"></div>
    <div style="height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px">
      <sc-if value="{{notSuccess}}" hint-placeholder-val="{{ true }}">
        <button type="button" style="justify-self: start; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #5B3FD9; font: inherit; font-size: 17px; cursor: pointer">Cancelar</button>
      </sc-if>
      <sc-if value="{{success}}" hint-placeholder-val="{{ false }}"><span></span></sc-if>
      <h1 style="margin: 0; font-size: 17px; font-weight: 600">{{title}}</h1>
      <span></span>
    </div>

    <sc-if value="{{notSuccess}}" hint-placeholder-val="{{ true }}">
      <div style="flex: 1; padding: 8px 16px 34px; display: flex; flex-direction: column; gap: 12px">
        <div style="border-radius: 20px; background: #FFFFFF; padding: 18px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px" aria-hidden="true">
            <span style="width: 52px; height: 52px; border-radius: 26px; background: #C0367A; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ma</span>
            <svg width="44" height="20" viewBox="0 0 44 20" fill="none" stroke="#6B6B76" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h36M32 3l7 7-7 7" stroke-dasharray="4 4"></path></svg>
            <span style="width: 52px; height: 52px; border-radius: 26px; background: #2563EB; color: #FFFFFF; font-size: 18px; font-weight: 700; display: flex; align-items: center; justify-content: center">Mi</span>
          </div>
          <span style="font-size: 20px; font-weight: 600">A Mara paga-te</span>
          <span style="font-size: 15px; color: #6B6B76">{{scope}}</span>
        </div>

        <div style="border-radius: 20px; background: #FFFFFF; padding: 12px 16px">
          <label for="valor-acerto" style="font-size: 13px; color: #6B6B76">{{amountLabel}}</label>
          <div style="display: flex; align-items: baseline; font-size: 44px; line-height: 52px; font-weight: 700; letter-spacing: -0.8px; font-variant-numeric: tabular-nums">
            <input id="valor-acerto" type="text" inputmode="decimal" value="{{amountMain}}" style="width: {{amountW}}; border: 0; outline: none; background: transparent; font: inherit; color: #111114; padding: 0">
            <span>{{amountRest}}</span>
          </div>
          <span style="font-size: 13px; color: #6B6B76">{{amountHint}}</span>
        </div>

        <sc-if value="{{all}}" hint-placeholder-val="{{ false }}">
          <div style="border-radius: 20px; background: #FFFFFF; overflow: hidden">
            <div style="padding: 12px 16px 4px; font-size: 13px; font-weight: 600; color: #6B6B76">Inclui 3 listas</div>
            <sc-for list="{{breakdown}}" as="b" hint-placeholder-count="3">
              <div style="height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-top: {{b.border}}">
                <span style="font-size: 20px" aria-hidden="true">{{b.icon}}</span>
                <span style="flex: 1; font-size: 17px">{{b.name}}</span>
                <span style="display: flex; flex-direction: column; align-items: flex-end">
                  <span style="font-size: 16px; font-weight: 600; color: {{b.color}}; font-variant-numeric: tabular-nums">{{b.amount}}</span>
                  <span style="font-size: 12px; color: #6B6B76">{{b.dir}}</span>
                </span>
              </div>
            </sc-for>
          </div>
        </sc-if>

        <div style="border-radius: 20px; background: #FFFFFF; overflow: hidden">
          <button type="button" style="width: 100%; height: 48px; border: 0; background: transparent; color: #111114; font: inherit; display: flex; align-items: center; gap: 8px; padding: 0 16px; cursor: pointer; text-align: left">
            <span style="flex: 1; font-size: 17px">Data</span>
            <span style="font-size: 15px; padding: 5px 10px; border-radius: 999px; background: #EEEEF3">Hoje</span>
          </button>
          <sc-if value="{{notAll}}" hint-placeholder-val="{{ true }}">
            <div style="border-top: 0.5px solid #E6E6EC; height: 48px; display: flex; align-items: center; padding: 0 16px">
              <input type="text" aria-label="Nota (opcional)" placeholder="Nota (opcional)" style="flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 17px">
            </div>
          </sc-if>
        </div>

        <div style="flex: 1"></div>
        <a href="AcertoSucesso.dc.html" style="height: 52px; border-radius: 16px; background: #6847F0; color: #FFFFFF; font-size: 17px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Registar pagamento</a>
      </div>
    </sc-if>

    <sc-if value="{{success}}" hint-placeholder-val="{{ false }}">
      <div style="flex: 1; padding: 0 24px 34px; display: flex; flex-direction: column; align-items: center; text-align: center">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">
          <dc-import name="Guru" pose="sucesso" size="{{ 220 }}" hint-size="220px,264px"></dc-import>
          <p style="margin: 6px 0 0; font-size: 28px; font-weight: 700; display: flex; align-items: center; gap: 8px">
            <span style="width: 28px; height: 28px; border-radius: 14px; background: #0B7A5C; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>
            </span>
            Contas acertadas!
          </p>
          <p style="margin: 0; font-size: 17px; color: #4A4A55; line-height: 24px">A Mara pagou-te 127,40 €.<br>Estão quites em todas as listas.</p>
        </div>
        <button type="button" style="width: 100%; height: 52px; border: 0; border-radius: 16px; background: #6847F0; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Concluído</button>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["lista","tudo","sucesso"],"default":"lista"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const variant = this.props.variant ?? 'lista';
    const all = variant === 'tudo';
    const success = variant === 'sucesso';
    const pos = '#0B7A5C', neg = '#B93D0B';
    const breakdown = [
      { icon: '🏠', name: 'Casa', amount: '+84,90 €', dir: 'a Mara deve-te', color: pos },
      { icon: '✈️', name: 'Férias Açores', amount: '+62,50 €', dir: 'a Mara deve-te', color: pos },
      { icon: '🎁', name: 'Prenda da mãe', amount: '−20,00 €', dir: 'deves à Mara', color: neg }
    ].map((b, i) => Object.assign(b, { border: '0.5px solid #E6E6EC' }));
    return {
      all, notAll: !all, success, notSuccess: !success, breakdown,
      title: all ? 'Acertar tudo' : (success ? '' : 'Acertar contas'),
      scope: all ? 'Todas as listas ativas' : 'Lista Casa',
      amountLabel: all ? 'Acertar tudo: 127,40 €' : 'Valor',
      amountMain: all ? '127' : '84',
      amountRest: all ? ',40 €' : ',90 €',
      amountW: all ? '84px' : '56px',
      amountHint: all ? 'O saldo líquido de todas as listas.' : 'Saldo da lista: 84,90 €. Altera o valor para um pagamento parcial.'
    };
  }
}
</script>
</body>
</html>
