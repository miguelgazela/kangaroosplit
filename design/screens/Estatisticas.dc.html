<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Estatísticas</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; color: #111114; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif">
  <div style="position: absolute; inset: 0; padding: 54px 16px 120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 4px 0 0; height: 52px; display: flex; align-items: center; font-size: 34px; font-weight: 700; letter-spacing: 0.4px">Estatísticas</h1>

    <div style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-haspopup="listbox" style="height: 44px; padding: 0 12px 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; color: #111114; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 6px; cursor: pointer">
        Todas as listas
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B6B76" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
      </button>
      <div style="flex: 1"></div>
      <div style="display: flex; align-items: center; border-radius: 999px; background: #FFFFFF; height: 44px">
        <button type="button" aria-label="Mês anterior" style="width: 40px; height: 44px; border: 0; background: transparent; color: #5B3FD9; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
        </button>
        <span style="font-size: 15px; font-weight: 600; min-width: 96px; text-align: center">Outubro 2026</span>
        <button type="button" aria-label="Mês seguinte" style="width: 40px; height: 44px; border: 0; background: transparent; color: #B4B4BC; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0" disabled="">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
        </button>
      </div>
    </div>

    <section aria-label="Total do mês" style="border-radius: 20px; background: #FFFFFF; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; color: #6B6B76">Total do mês</span>
          <span style="font-size: 34px; line-height: 40px; font-weight: 700; letter-spacing: -0.6px; font-variant-numeric: tabular-nums">1.451<span style="color: #8A8A94">,55 €</span></span>
          <span style="font-size: 13px; color: #6B6B76">+10,1 % do que em setembro</span>
        </div>
        <figure style="margin: 0; display: flex; flex-direction: column; gap: 4px" aria-label="Últimos 6 meses">
          <figcaption style="font-size: 11px; color: #6B6B76; text-align: right">Últimos 6 meses</figcaption>
          <div style="height: 64px; display: flex; align-items: flex-end; gap: 4px" role="img" aria-label="maio 1.380,20 €, junho 1.602,85 €, julho 1.295,40 €, agosto 2.140,10 €, setembro 1.318,45 €, outubro 1.451,55 €">
            <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
              <div style="width: 18px; display: flex; flex-direction: column; align-items: center; gap: 4px">
                <div style="width: 18px; height: {{m.h}}; border-radius: 4px 4px 0 0; background: {{m.fill}}"></div>
              </div>
            </sc-for>
          </div>
          <div style="display: flex; gap: 4px">
            <sc-for list="{{months}}" as="m" hint-placeholder-count="6">
              <span style="width: 18px; text-align: center; font-size: 10px; color: {{m.labelColor}}; font-weight: {{m.fw}}">{{m.label}}</span>
            </sc-for>
          </div>
        </figure>
      </div>
      <div style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px" role="img" aria-label="A tua parte 59,7 %, parte da Mara 40,3 %">
        <span style="width: 59.7%; background: #2563EB"></span>
        <span style="flex: 1; background: #C0367A"></span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #2563EB; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">Mi</span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6B6B76">A tua parte</span><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">866,93 €</span></span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 28px; height: 28px; border-radius: 14px; background: #C0367A; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">Ma</span>
          <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #6B6B76">Parte da Mara</span><span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">584,62 €</span></span>
        </div>
      </div>
    </section>

    <section aria-label="Por categoria" style="border-radius: 20px; background: #FFFFFF; padding: 14px 16px 6px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">Por categoria</h2>
        <span style="font-size: 13px; color: #6B6B76">6 categorias</span>
      </div>
      <div style="display: flex; height: 14px; border-radius: 4px; overflow: hidden; gap: 2px" role="img" aria-label="Distribuição por categoria">
        <sc-for list="{{cats}}" as="k" hint-placeholder-count="6">
          <span style="width: {{k.w}}; min-width: 3px; background: {{k.color}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; flex-direction: column">
        <sc-for list="{{cats}}" as="k" hint-placeholder-count="6">
          <div style="height: 42px; display: flex; align-items: center; gap: 10px; border-top: {{k.border}}">
            <span style="width: 10px; height: 10px; border-radius: 3px; background: {{k.color}}; flex: none"></span>
            <span style="font-size: 17px; width: 22px; text-align: center" aria-hidden="true">{{k.icon}}</span>
            <span style="flex: 1; font-size: 15px">{{k.name}}</span>
            <span style="font-size: 13px; color: #6B6B76; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right">{{k.pct}}</span>
            <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right">{{k.amount}}</span>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
  <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 100px">
    <dc-import name="TabBar" active="estatisticas" hint-size="390px,100px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [['mai', 1380.20], ['jun', 1602.85], ['jul', 1295.40], ['ago', 2140.10], ['set', 1318.45], ['out', 1451.55]];
    const max = 2140.10;
    const months = data.map(([label, v], i) => {
      const cur = i === data.length - 1;
      return { label, h: Math.round(v / max * 64) + 'px', fill: cur ? '#6847F0' : '#D9D0FC', labelColor: cur ? '#111114' : '#6B6B76', fw: cur ? 600 : 400 };
    });
    const total = 1451.55;
    const raw = [
      ['🏠', 'Renda', 1150.00, '#6847F0'],
      ['🛒', 'Supermercado', 86.35, '#E07020'],
      ['🍽️', 'Restaurantes', 74.00, '#1A9E8F'],
      ['💡', 'Contas', 61.20, '#2F80ED'],
      ['🚗', 'Transportes', 40.00, '#C99A06'],
      ['📦', 'Outros', 40.00, '#D04E8A']
    ];
    const fmt = (n) => { const p = n.toFixed(2).split('.'); return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1] + ' €'; };
    const cats = raw.map(([icon, name, v, color], i) => ({
      icon, name, color, amount: fmt(v),
      pct: (v / total * 100).toFixed(1).replace('.', ',') + ' %',
      w: (v / total * 100).toFixed(2) + '%',
      border: i === 0 ? 'none' : '0.5px solid #E6E6EC'
    }));
    return { months, cats };
  }
}
</script>
</body>
</html>
